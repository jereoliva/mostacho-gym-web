<!DOCTYPE html>
<html lang="es-AR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Restringido | Mostacho Gym</title>
    
    <!-- Tipografías Industriales -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Lora:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    
    <!-- Hojas de Estilo Modularizadas -->
    <link rel="stylesheet" href="./src/css/variables.css">
    <link rel="stylesheet" href="./src/css/global.css">
    <link rel="stylesheet" href="./src/css/login.css">
</head>
<body class="login-body">

    <!-- BOTÓN DE RETORNO -->
    <a href="index.html" class="btn-back">
        ← Volver a la Forja
    </a>

    <!-- CONTENEDOR DE AUTENTICACIÓN -->
    <main class="login-container">
        <div class="login-card card-industrial">
            
            <div class="login-header">
                <img src="./public/imagen/logo.png" alt="Mostacho Logo" class="login-logo">
                <h1 style="color: var(--text-main); font-size: 3rem; margin-bottom: 5px;">ACCESO ADMIN</h1>
                <p style="color: var(--text-muted); font-family: var(--font-text);">Identifícate, Comandante.</p>
            </div>

            <form id="admin-login-form" class="login-form">
                
                <div class="form-group">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="email" name="email" placeholder="admin@mostachogym.com" required>
                </div>
                
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" placeholder="••••••••" required>
                </div>

                <!-- Contenedor para mostrar errores de autenticación -->
                <div id="login-error" class="error-message oculto">
                    Credenciales incorrectas. Intenta nuevamente.
                </div>

                <!-- El type="submit" enviará los datos a nuestro futuro script de Supabase -->
                <button type="submit" class="btn-primary-full login-btn">INGRESAR A LA BÓVEDA</button>
            </form>
            
        </div>
    </main>

    <!-- SCRIPT (Por ahora vacío, aquí conectaremos Supabase Auth en el próximo paso) -->
    <script src="./src/js/core/auth.js"></script>
</body>
</html>
